services:

  postgres:
    image: postgres:16
    container_name: REDACTED_DATABASE_PASSWORD-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: REDACTED_DATABASE_PASSWORD
      POSTGRES_USER: REDACTED_DATABASE_PASSWORD
      POSTGRES_PASSWORD: REDACTED_DATABASE_PASSWORD

    ports:
      - "5433:5432"

    volumes:
      - REDACTED_DATABASE_PASSWORD_postgres_data:/var/lib/postgresql/data

volumes:
  REDACTED_DATABASE_PASSWORD_postgres_data: